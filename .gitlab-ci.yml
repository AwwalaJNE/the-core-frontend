build dev:
    image: node:14.15.0
    stage: build 
    tags:
      - aws-docker-executor
    script:
      - npm install --progress=false
      - npm run build
    artifacts:
      expire_in: 1 week
      paths:
        - dist
    only :
      - development

deploy dev:
  image: alpine
  stage: deploy
  tags:
    - aws-docker-executor
  script:
      - apk add --no-cache rsync openssh
      - mkdir -p ~/.ssh
      - echo "$SSH_PRIVATE_KEY" >> ~/.ssh/id_dsa
      - chmod 600 ~/.ssh/id_dsa
      - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
      - rsync -rav --delete dist/ root@147.139.179.214:/var/www/coreapp-v2/dist
      - ls -la      
  only :
    - development
  