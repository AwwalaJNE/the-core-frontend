build dev:
    image: node:10.13.0
    stage: build 
    tags:
      - docker-exec
    script:
      - npm install --progress=false
      - npm run build
    artifacts:
      expire_in: 1 week
      paths:
        - dist
    only :
      - development

deploy dev:
  image: alpine
  stage: deploy
  tags:
    - docker-exec
  script:
      - apk add --no-cache rsync openssh
      - mkdir -p ~/.ssh
      - echo "$SSH_PRIVATE_KEY_DEV" >> ~/.ssh/id_dsa
      - chmod 600 ~/.ssh/id_dsa
      - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
      - rsync -rav --delete dist/ root@149.129.247.176:/var/www/html/the-core-frontend-v2/dist
      - ls -la      
  only :
    - development
  
