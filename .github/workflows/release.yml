name: Version Bump and Release

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  bump_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: development

      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Get all tags and sort by version number
          latest_tag=$(git tag -l | sed 's/^v\./v/' | sort -V | tail -n 1 || echo "0.1.0")
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV
          echo "Latest tag: $latest_tag"

      - name: Calculate new version
        id: calculate_version
        run: |
          latest_tag="${{ env.LATEST_TAG }}"
          # Remove 'v' prefix and any extra dots, then split into parts
          version="${latest_tag#v}"
          version="${version#.}"  # Remove extra dot if present
          IFS='.' read -ra PARTS <<< "$version"
          major=${PARTS[0]}
          minor=${PARTS[1]:-0}
          patch=${PARTS[2]:-0}
          
          # Bump minor version
          new_minor=$((minor + 1))
          new_version="v.$major.$new_minor.0"
          new_version_tag="$major.$new_minor.0"
          
          # Check if the new version already exists
          if git rev-parse "$new_version" >/dev/null 2>&1; then
            echo "::error::Version $new_version already exists"
            exit 1
          fi
          
          echo "NEW_VERSION=$new_version" >> $GITHUB_ENV
          echo "NEW_VERSION_TAG=$new_version_tag" >> $GITHUB_ENV
          echo "New version: $new_version"

      - name: Generate release notes from commits
        id: generate_release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag="${{ env.LATEST_TAG }}"
          new_version="${{ env.NEW_VERSION_TAG }}"
          repo="${{ github.repository }}"
          repo_url="https://github.com/$repo"

          # Get commit SHAs
          if [ "$latest_tag" = "0.1.0" ]; then
            # No previous tag -> use all commits
            commit_shas=$(git log --format="%H")
          else
            # Commits since latest tag
            commit_shas=$(git log "$latest_tag"..HEAD --format="%H")
          fi

          commits=""
          for sha in $commit_shas; do
            msg=$(git show -s --format="%s" "$sha")
            short_sha=$(git rev-parse --short "$sha")

            # Get GitHub username from API
            login=$(curl -s \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/commits/$sha" \
              | jq -r '.author.login // .commit.author.name')

            commits+="- $msg by @$login in $short_sha"$'\n'
          done

          # Extract version numbers for changelog link
          latest_version="${latest_tag#v}"
          latest_version="${latest_version#.}"
          new_version_number="${new_version#v}"

          {
            echo "RELEASE_BODY<<EOF"
            echo "## What's Changed"
            echo "$commits"
            echo ""
            echo "**Full Changelog**: [$latest_version...$new_version_number]($repo_url/compare/$latest_tag...$new_version)"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create new tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Double check the tag doesn't exist before creating it
          if ! git rev-parse "${{ env.NEW_VERSION }}" >/dev/null 2>&1; then
            git tag ${{ env.NEW_VERSION_TAG }}
            git push origin ${{ env.NEW_VERSION_TAG }}
          else
            echo "Tag ${{ env.NEW_VERSION_TAG }} already exists, skipping tag creation"
            exit 1
          fi

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.NEW_VERSION_TAG }}
          name: ${{ env.NEW_VERSION }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
