name: Comment when Router File Changes

on:
  pull_request:
    paths:
      - "src/router/index.js"

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "## 🚨 New/Modified Routes Detected!\n\nHi there 👋 This PR modifies some monitored files.\nPlease add/update the new/modified routes to `tc_feature_list` ✨\n\nThanks for your contribution! 💖"
            })